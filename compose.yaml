name: postgres-benchmark
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: docbench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: local-bench-only
    ports:
      - "127.0.0.1:55432:5432"
    shm_size: 512mb
    command: [postgres, -c, shared_buffers=256MB, -c, work_mem=16MB, -c, maintenance_work_mem=256MB, -c, track_io_timing=on]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/bench:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bench -d docbench"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
